
name: Build Watch8 Calculator Native APK

on:
  push:
    branches: [main]
    paths:
      - 'Watch8_Calculator_Native_OneUpload_Source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract complete calculator source
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq Watch8_Calculator_Native_OneUpload_Source.zip -d .
          test -f app/build.gradle
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/weixiaoyinjie/pricecalculator/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo 'Android SDK not found'
            exit 1
          fi
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -f "$SDK/build-tools/35.0.0/aapt" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check built APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m 1 'launchable-activity'

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-Calculator-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
